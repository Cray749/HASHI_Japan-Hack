# Closed list of cabin requests. Passenger labels are short (tile text); ja is the
# sentence the crew card shows; en is the subtitle.
# urgency: 1 routine, 2 needs attention, 3 urgent (red, always on top)
# tile: true means it sits on the passenger home grid, the rest are under "More".
# replies: one-tap reply ids (see replies.yaml) offered to crew for this request.
- id: water
  cat: drink
  urgency: 1
  icon: GlassWater
  tile: true
  en: Water, please
  ja: お水をお願いします
  hi: पानी चाहिए
  pa: ਪਾਣੀ ਚਾਹੀਦਾ ਹੈ
  replies: [bringing, wait, unavailable]
