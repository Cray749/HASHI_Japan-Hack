  turbulence: "காற்றில் அதிர்வு ஏற்படலாம். தயவுசெய்து இருக்கைக்குத் திரும்பி பட்டையை அணியுங்கள்."
  safety_briefing: "பாதுகாப்பு விளக்கம் தொடங்குகிறது. திரையை அல்லது குழுவினரைப் பாருங்கள். வெளியேறும் வழிகள் சிவப்பில் உள்ளன."
  electronics_off: "தயவுசெய்து உங்கள் போனை விமான பயன்முறையில் வையுங்கள் அல்லது அணையுங்கள்."
  meal_service: "உணவு வழங்கல் தொடங்குகிறது. தயவுசெய்து இருக்கையில் இருங்கள்."
  landing_soon: "விரைவில் தரையிறங்குவோம். இருக்கையை நேராக்கி மேசையை மூடுங்கள்."
  forms_ready: "வருகைப் படிவங்கள் வழங்கப்படுகின்றன. நிரப்ப உதவி வேண்டுமானால் சொல்லுங்கள்."
  stay_seated_light: "விமானம் நின்று அடையாளம் அணையும் வரை இருக்கையில் இருங்கள்."
